<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plzeňák</title>
    <!-- Favicon: PNG pro starší prohlížeče, SVG pro ostatní (ostrý v každé velikosti),
         apple-touch-icon pro ikonu na ploše iPhonu. Soubory leží v public/. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Téma homepage se nastaví dřív, než se vykreslí stránka, ať se nezablikne
         jiné než zvolené. Výchozí je světlé, tmavé jen při uložené volbě. Stejná
         logika jako resolveMode v lib/landingTheme.js. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('plzenak-theme');
          document.documentElement.setAttribute('data-lp-mode', stored === 'dark' ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.jsx"></script>
  </body>
</html>
