server {
    listen 80;
    access_log off;
    root /usr/share/nginx/html;

    # Jméno "backend" překládá DNS Dockeru (127.0.0.11). Cíl je v proměnné, aby
    # Nginx nastartoval i ve chvíli, kdy backend ještě neběží: s pevnou adresou
    # v proxy_pass by jméno překládal hned při startu a bez backendu by spadl.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:3001;

    # Existující soubor z buildu (assets, robots.txt, favicon, ověřovací soubor
    # Seznamu) vrátí Nginx sám. Všechno ostatní je stránka a jde na serverový
    # renderer v backendu (SEO, od 2026-10-19). Záměrně bez $uri/ a bez
    # /index.html na konci: dřív právě ten konec posílal každou adresu na
    # statickou SPA a backend se o stránku vůbec nedozvěděl.
    location / {
        try_files $uri @render;
    }

    # Šablona pro renderer: backend si odsud stahuje index.html z buildu
    # (SITE_TEMPLATE_URL, výchozí http://frontend/index.html). Musí zůstat
    # statický soubor, jinak by se renderer ptal sám sebe.
    location = /index.html {
    }

    location @render {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass $backend_upstream;

        # Když backend neodpovídá (502, 504) nebo stránku nevykreslí (503),
        # vrátí se statický index.html a web běží jako čistá SPA, jen bez SEO.
        # proxy_intercept_errors zasáhne jen u kódů, které mají error_page,
        # takže 301 a 404 z rendereru projdou beze změny. "=" bez kódu znamená,
        # že odpověď převezme kód náhradní stránky (200), ne původní 503.
        proxy_intercept_errors on;
        error_page 502 503 504 = /index.html;
    }

    location /api/ {
        client_max_body_size 6m;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass $backend_upstream;
    }
}
